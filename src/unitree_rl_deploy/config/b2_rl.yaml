# RL deploy for a B2-shaped policy. Same node as Go2; only this file changes.
# Edit default_angles / terms / action_scale to match the training env.
# Unitree stand-example pose is closer to thigh 0.67, calf -1.3; Isaac B2
# locomotion often uses 0.8 / -1.5. Wrong defaults make the first step a jump.
/**:
  ros__parameters:
    policy_path: ""
    control_rate: 50.0
    command_topic: joint_commands
    joint_state_topic: joint_states
    imu_topic: imu/data
    cmd_vel_topic: cmd_vel
    joint_names:
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
    default_angles:
      - 0.1
      - 0.8
      - -1.5
      - -0.1
      - 0.8
      - -1.5
      - 0.1
      - 0.8
      - -1.5
      - -0.1
      - 0.8
      - -1.5
    action_scale: 0.25
    hip_scale_reduction: 1.0
    hip_indices: [0, 3, 6, 9]
    clip_actions: 100.0
    max_cmd: [1.0, 0.5, 1.0]
    imu_timeout_sec: 0.2
    joint_timeout_sec: 0.2
    cmd_timeout_sec: 0.5
    # Uncomment to match training PD. Default hardware PD is the B2 stand
    # example in config/b2_lowcmd.yaml (1000 / 10).
    # kp: 1000.0
    # kd: 10.0
    observation:
      clip: 100.0
      history: 1
      ang_vel_scale: 0.25
      dof_pos_scale: 1.0
      dof_vel_scale: 0.05
      cmd_scale: [2.0, 2.0, 0.25]
      clock_period: 0.8
      terms:
        - ang_vel
        - gravity
        - command
        - dof_pos
        - dof_vel
        - action
