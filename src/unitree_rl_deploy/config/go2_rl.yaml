# RL deploy for a Go2 DLS Flat / Rough-Blind policy
# (iit-DLSLab basic-locomotion-isaaclab, use_vision=False).
#
# Joint names, default_angles, observation terms and action_scale MUST match
# the env that produced the checkpoint. The runner has no robot id; this file
# is selected by robot:=go2.
#
# Shipped layout is 52-D x history 5 = 260-D:
#   lin_vel(3) ang_vel(3) gravity(3) command(3)
#   dof_pos(12) dof_vel(12) last_action(12) gait_clock(4)
# Joint / action order is DLS hip-group (not per-leg):
#   FL_hip FR_hip RL_hip RR_hip | FL_thigh FR_thigh RL_thigh RR_thigh
#   | FL_calf FR_calf RL_calf RR_calf
# All observation scales are 1.0. Commands are raw [vx, vy, yaw_rate].
# lin_vel is body-frame COM velocity (Isaac root_lin_vel_b). MuJoCo publishes
# link-origin twist on odom/ground_truth; the runner adds ω × r_com.
# On hardware, remap odom_topic to an estimator (or set base_state_topic for
# DLS /base_state, whose linear velocity is world-frame and is rotated here).
/**:
  ros__parameters:
    policy_path: ""
    control_rate: 50.0
    command_topic: joint_commands
    joint_state_topic: joint_states
    imu_topic: imu/data
    cmd_vel_topic: cmd_vel
    odom_topic: odom/ground_truth
    base_state_topic: ""
    # Odometry.twist frame. DLS /base_state is always treated as world.
    lin_vel_frame: body
    joint_names:
      - FL_hip_joint
      - FR_hip_joint
      - RL_hip_joint
      - RR_hip_joint
      - FL_thigh_joint
      - FR_thigh_joint
      - RL_thigh_joint
      - RR_thigh_joint
      - FL_calf_joint
      - FR_calf_joint
      - RL_calf_joint
      - RR_calf_joint
    default_angles:
      - 0.0
      - 0.0
      - 0.0
      - 0.0
      - 0.9
      - 0.9
      - 0.9
      - 0.9
      - -1.8
      - -1.8
      - -1.8
      - -1.8
    action_scale: 0.5
    hip_scale_reduction: 1.0
    hip_indices: [0, 1, 2, 3]
    clip_actions: 3.0
    use_filter_actions: true
    filter_alpha: 0.8
    max_cmd: [0.8, 0.25, 0.5]
    # Go2 base inertial origin (URDF). Isaac trains on COM lin_vel.
    lin_vel_com_offset: [0.021112, 0.0, -0.005366]
    gait_phase_offsets: [0.0, 0.5, 0.5, 0.0]
    gait_step_freq_min: 1.4
    gait_step_freq_max: 1.8
    gait_speed_min: 0.4
    gait_speed_max: 0.8
    gait_still_command_threshold: 0.01
    imu_timeout_sec: 0.2
    joint_timeout_sec: 0.2
    cmd_timeout_sec: 0.5
    lin_vel_timeout_sec: 0.2
    # DLS walking deploy PD (train stiffness 20 / damping 1.5).
    kp: 20.0
    kd: 2.0
    observation:
      clip: 100.0
      history: 5
      clock_size: 4
      lin_vel_scale: 1.0
      ang_vel_scale: 1.0
      dof_pos_scale: 1.0
      dof_vel_scale: 1.0
      cmd_scale: [1.0, 1.0, 1.0]
      clock_period: 0.8
      terms:
        - lin_vel
        - ang_vel
        - gravity
        - command
        - dof_pos
        - dof_vel
        - action
        - clock
