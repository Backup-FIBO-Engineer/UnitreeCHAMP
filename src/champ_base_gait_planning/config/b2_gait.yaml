/**:
  ros__parameters:
    gait:
      knee_orientation: ">>"
      odom_scaler: 0.9
      # Official B2 planar reach = 0.35 + 0.35 = 0.70 m.
      # nominal_height 0.50 sits 200 mm above fully stretched Z=-0.70 and is
      # ~88% of the unitree_ros2 b2_stand_example pose (thigh 0.67, calf -1.3).
      # Limits kept conservative so simultaneous (vx,vy,wz) stays inside IK.
      max_linear_velocity_x: 0.60
      max_linear_velocity_y: 0.20
      max_angular_velocity_z: 0.6
      # Slew /cmd_vel in quadruped_controller_node (0 = step). B2 ~70 kg
      # lunges if the stick jumps to max_linear_velocity_x.
      max_linear_acceleration: 0.30
      max_angular_acceleration: 0.40
      com_x_translation: 0.0
      swing_height: 0.10
      stance_depth: 0.0
      stance_duration: 0.30
      nominal_height: 0.50
