# MuJoCo settings for Go2. Geometry, inertials, joint limits, efforts and
# velocity limits are taken from urdf/go2.urdf by tools/generate_mjcf.py and
# mujoco/mujoco_sim.py; this file only holds simulator tuning.
/**:
  ros__parameters:
    sim:
      # Position-actuator gains (MuJoCo <position kp kv>). Hip abduction gets a
      # lower kp than the pitch joints.
      actuator_kp_hip: 80.0
      actuator_kp_leg: 160.0
      actuator_kv: 6.0
      # Passive joint model applied to every hinge.
      joint_damping: 0.5
      joint_armature: 0.01
      joint_frictionloss: 0.05
      # Sliding, torsional, rolling friction of every collision geom.
      geom_friction: [1.2, 0.005, 0.0001]
      # Extra height above (nominal_height + foot radius) at which the body spawns.
      spawn_clearance: 0.02
      # <= 0: rate-limit joint targets with the URDF <limit velocity> of each joint.
      max_joint_velocity: 0.0
