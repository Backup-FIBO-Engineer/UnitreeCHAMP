# body_pose_controller_node parameters for Go2: IMU-closed body roll/pitch on
# top of CHAMP (gait + IK + joint PD unchanged). The IMU mounting comes from
# urdf/go2.urdf + go2_links.yaml (links_map.base -> links_map.imu), passed by
# the launch alongside this file. Angles in rad, rates in rad/s.
/**:
  ros__parameters:
    # sensor_msgs/Imu with a fused orientation: /imu/data from unitree_ros2_bridge
    # (/lowstate imu_state) or mujoco_sim.py. Override per launch (imu_topic:=...).
    imu_topic: imu/data
    desired_pose_topic: body_pose
    command_pose_topic: body_pose/corrected
    body_pose:
      enabled: true
      control_rate: 100.0
      # command = desired + kp*e + ki*integral(e) - kd*body_rate, e = desired - measured.
      kp: 0.5
      ki: 2.0
      kd: 0.02
      filter_cutoff_hz: 5.0      # low-pass on the IMU roll/pitch (foot impacts while trotting)
      deadband: 0.005            # ~0.3 deg; zero inside, |e|-deadband beyond it (no step at the edge)
      max_correction: 0.15       # closed-loop share of the command (and integral clamp)
      max_rate: 0.5              # slew of the correction
      desired_rate: 0.5          # slew of the user's desired roll/pitch/yaw (no steps to the legs)
      # Total body roll/pitch handed to CHAMP (desired + correction, clamped).
      # verify_body_pose_controller checks both at once, all sign combinations,
      # standing and walking at the go2_gait.yaml max velocities, against IK reach
      # and the URDF joint limits. Kinematic ceilings at nominal_height 0.30
      # (calf joint limit): pitch 0.47 standing, 0.33 walking straight at 0.5 m/s,
      # 0.26 at max vx+vy+wz; roll >= 0.70 in every case. 0.20 keeps >= 0.06 rad
      # of margin while walking at any commanded velocity.
      max_roll: 0.25
      max_pitch: 0.20
      # |e| above this means the robot is not standing (fallen, lying, carried);
      # the correction is released instead of integrated.
      max_error: 0.35
      imu_timeout_sec: 0.2
      # Optional: [roll, pitch, yaw] of the IMU axes in the base frame when the
      # IMU topic is not expressed in links_map.imu (external driver). Default: URDF.
      # imu_mount_rpy: [0.0, 0.0, 0.0]
