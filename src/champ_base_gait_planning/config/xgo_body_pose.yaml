# body_pose_controller_node parameters for XGO (MuJoCo only, no LowCmd):
# IMU-closed body roll/pitch on top of CHAMP (gait + IK + joint PD unchanged).
# The IMU mounting comes from urdf/xgo.xacro + xgo_links.yaml
# (links_map.base -> links_map.imu), passed by the launch alongside this file.
# Angles in rad, rates in rad/s.
/**:
  ros__parameters:
    # sensor_msgs/Imu with a fused orientation (mujoco_sim.py /imu/data).
    imu_topic: imu/data
    desired_pose_topic: body_pose
    command_pose_topic: body_pose/corrected
    body_pose:
      enabled: true
      control_rate: 100.0
      # command = desired + kp*e + ki*integral(e) - kd*body_rate, e = desired - measured.
      kp: 0.5
      ki: 2.0
      kd: 0.01
      filter_cutoff_hz: 5.0      # low-pass on the IMU roll/pitch (foot impacts while trotting)
      deadband: 0.005            # ~0.3 deg
      max_correction: 0.12       # closed-loop share of the command (and integral clamp)
      max_rate: 0.6              # slew of the correction
      # Total body roll/pitch handed to CHAMP; short legs (reach 0.146 m at
      # nominal_height 0.10), so smaller than Go2/B2. verify_body_pose_controller
      # checks that both at once stay inside the IK reach.
      max_roll: 0.20
      max_pitch: 0.20
      # |e| above this means the robot is not standing (fallen, lying, carried);
      # the correction is released instead of integrated.
      max_error: 0.35
      imu_timeout_sec: 0.2
      # Optional: [roll, pitch, yaw] of the IMU axes in the base frame when the
      # IMU topic is not expressed in links_map.imu (external driver). Default: URDF.
      # imu_mount_rpy: [0.0, 0.0, 0.0]
