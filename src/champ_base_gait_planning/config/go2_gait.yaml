/**:
  ros__parameters:
    gait:
      knee_orientation: ">>"
      odom_scaler: 0.9
      # Official Go2 planar reach = 0.213 + 0.213 = 0.426 m.
      # nominal_height 0.30 sits ~126 mm above fully stretched Z=-0.426.
      # Limits kept conservative so simultaneous (vx,vy,wz) stays inside IK.
      max_linear_velocity_x: 0.50
      max_linear_velocity_y: 0.15
      max_angular_velocity_z: 0.6
      max_linear_acceleration: 0.40
      max_angular_acceleration: 0.50
      com_x_translation: 0.0
      # 0.05 m stubs in MuJoCo (robot walks backward). 0.08 m clears the floor.
      swing_height: 0.08
      stance_depth: 0.0
      stance_duration: 0.25
      swing_duration: 0.25
      nominal_height: 0.30
