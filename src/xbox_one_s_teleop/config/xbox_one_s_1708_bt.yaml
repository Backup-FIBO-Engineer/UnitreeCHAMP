# Xbox One S Wireless Controller, Model 1708, Bluetooth.
#
# Default indices are SDL2, which is what ROS 2 Humble/Jazzy `joy_node`
# (package `joy`) publishes on /joy. Stick-up is a negative axis value.
#
#   axis 0 left X   axis 1 left Y   axis 2 right X   axis 3 right Y
#   axis 4 LT       axis 5 RT
#
# If you launched `joy_linux_node` instead (kernel js / jstest order), use
# config/xbox_one_s_1708_bt_linuxjs.yaml (launch driver:=linux).
#
#   RB (5)  hold to send /cmd_vel (released = stop)
#   B  (1)  zero /cmd_vel immediately
#
# Left stick X/Y = vy / vx (simultaneous), right stick X = yaw.
# invert_vy/yaw true: stick right → robot right / turn right (ROS +y left, +yaw CCW).
#
# Speed limits are overwritten by teleop.launch.py from
# unitree_rl_deploy config/<robot>_rl.yaml max_cmd when robot:= is set.
/**:
  ros__parameters:
    joy_topic: joy
    cmd_vel_topic: cmd_vel
    publish_rate: 20.0
    joy_timeout_sec: 0.5
    deadzone: 0.15
    axis_vx: 1
    axis_vy: 0
    axis_yaw: 2
    invert_vx: true
    invert_vy: true
    invert_yaw: true
    button_deadman: 5
    button_stop: 1
    # Used only when launch is not given robot:= (no *_rl.yaml max_cmd overlay).
    max_linear_x: 0.5
    max_linear_y: 0.15
    max_angular_z: 0.6
